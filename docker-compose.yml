services:
  enxbot:
    image: ghcr.io/skrashevich/enxbot:latest
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      BOT_USERNAME: ${BOT_USERNAME:?Set BOT_USERNAME in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
    volumes:
      - enxbot-data:/data

volumes:
  enxbot-data:
